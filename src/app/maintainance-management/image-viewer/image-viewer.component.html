<ion-header>
  <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">{{showHeading}}</div>
      <div class="right_action">
        <ion-icon class="dynamic_color icon-size" (click)="dismiss()" name="close-circle-outline"></ion-icon>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
<ion-content class="internal_card_container">
  <ion-grid *ngIf="imageArray?.length">
    <ion-row>
      <ion-col size="6" *ngFor="let photo of imageArray; index as position">
        <ion-card class="m-0">
          <img (click)="viewImage(photo)" [src]="photo?.imageUrlUrl" />
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab *ngIf="uploadPhoto" vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
