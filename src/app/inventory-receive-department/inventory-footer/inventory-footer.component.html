        <ion-tab-button tab="Received Inventory" (click)="goToPage('Received Inventory')" [class.active]="selectedTab === 'Received Inventory'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'Received Inventory'">
        <ion-icon name="file-tray-stacked-outline" *ngIf="selectedTab !== 'Received Inventory'"></ion-icon>
        <ion-icon name="file-tray-stacked" *ngIf="selectedTab === 'Received Inventory'"></ion-icon>
      </div>
      <span class="inner_text">Inventory</span>
    </ion-tab-button>
     <ion-tab-button tab="User" (click)="goToPage('User')" [class.active]="selectedTab === 'User'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'User'">
        <ion-icon name="person-circle-outline" *ngIf="selectedTab !== 'User'"></ion-icon>
        <ion-icon name="person-circle" *ngIf="selectedTab === 'User'"></ion-icon>
      </div>
      <span class="inner_text">User</span>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
