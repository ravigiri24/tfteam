<ion-header [ngClass]="listColorClass">
  <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">
        <span class="selected_text">Start Transport Information</span>
      </div>
      <div class="right_action">
        <ion-icon (click)="dismiss()" class="dynamic_color" name="close-circle-outline"></ion-icon>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding internal_card_container" [ngClass]="listColorClass">
  <form class="form_basic_height" [formGroup]="form">
    <div class="global_input_block">
      <ion-input label="Transportation Start Date" fill="outline" labelPlacement="stacked" type="date"
        formControlName="transport_start_date"></ion-input>
    </div>
    <div class="global_input_block">
      <ion-input label="From to Where Detail" fill="outline" labelPlacement="stacked" type="text"
        formControlName="transport_src_place"></ion-input>
    </div>
    <div class="page_submit_btn">
      <ion-button (click)="updateItem()" class="global_submit_color_button dynamic_bgcolor"
        expand="block">Start</ion-button>
    </div>
  </form>
</ion-content>
