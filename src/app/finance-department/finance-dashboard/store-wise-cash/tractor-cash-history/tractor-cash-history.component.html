<ion-header class="tfd-header">
  <ion-toolbar>
    <ion-title class="tfd-title">
      <span class="tfd-title-icon" aria-hidden="true"><ion-icon name="cash-outline"></ion-icon></span>
      <span class="tfd-title-copy"><strong>Cash History</strong><small>Tractor cash payments and receipts</small></span>
    </ion-title>
    <ion-buttons slot="end">
      <button class="tfd-close-btn" type="button" (click)="dismiss()" aria-label="Close cash history"><ion-icon name="close-outline"></ion-icon></button>
    </ion-buttons>
  </ion-toolbar>
  <div class="tfd-header-art" aria-hidden="true"><span class="tfd-orb tfd-orb-one"></span><span class="tfd-orb tfd-orb-two"></span></div>
</ion-header>
<ion-content class="tfd-content">
  <section class="tfd-summary-card" aria-labelledby="cash-history-title">
    <div class="tfd-section-heading">
      <span class="tfd-section-icon" aria-hidden="true"><ion-icon name="receipt-outline"></ion-icon></span>
      <span><strong>{{ tractorDetails?.registractionNo || tractorDetails?.name }}</strong><small>Tractor cash receipts</small></span>
    </div>
    <div class="tfd-cash-receipts-heading">
      <span><strong id="cash-history-title">Cash History</strong><small>Add each cash payment received</small></span>
      <button class="tfd-cash-add-btn" type="button" (click)="addReceipt()" [disabled]="!tractorDetails?.id"><ion-icon name="add-outline"></ion-icon>Add Receipt</button>
    </div>
    <p class="cash-state" *ngIf="loading" role="status">Loading cash history...</p>
    <div class="cash-state" *ngIf="error" role="alert">Unable to load cash history. <button class="tfd-cash-add-btn" type="button" (click)="getCashList()">Retry</button></div>
    <p class="cash-state" *ngIf="!loading && !error && !cashHistory.length">No cash receipts found for this tractor.</p>
    <ng-container *ngIf="!loading && !error">
      <app-cash-transaction-list [receipts]="cashHistory" (changed)="receiptChanged()"></app-cash-transaction-list>
    </ng-container>
  </section>
</ion-content>
