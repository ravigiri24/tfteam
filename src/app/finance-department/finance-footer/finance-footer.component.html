        <ion-tab-button tab="Sold" (click)="goToPage('Sold')" [class.active]="selectedTab === 'Sold'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'Sold'">
        <ion-icon name="flash-outline" *ngIf="selectedTab !== 'Sold'"></ion-icon>
        <ion-icon name="flash" *ngIf="selectedTab === 'Sold'"></ion-icon>
      </div>
      <span class="inner_text">Sold</span>
    </ion-tab-button>
    <!-- <ion-tab-button (click)="goToPage('Financed')" tab="JobList">
      <ion-icon *ngIf="selectedTab!=='Financed'" class="theme-color" name="aperture-outline"></ion-icon>
      <ion-icon *ngIf="selectedTab==='Financed'" class="theme-color" name="aperture"></ion-icon>

        <span class="inner_text">Financed</span></label>

  <ion-tab-button tab="Financed" (click)="goToPage('Financed')" [class.active]="selectedTab === 'Financed'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'Financed'">
        <ion-icon name="aperture-outline" *ngIf="selectedTab !== 'Financed'"></ion-icon>
        <ion-icon name="aperture" *ngIf="selectedTab === 'Financed'"></ion-icon>
      </div>
      <span class="inner_text">Financed</span>
    </ion-tab-button>
    <ion-tab-button tab="User" (click)="goToPage('User')" [class.active]="selectedTab === 'User'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'User'">
        <ion-icon name="person-circle-outline" *ngIf="selectedTab !== 'User'"></ion-icon>
        <ion-icon name="person-circle" *ngIf="selectedTab === 'User'"></ion-icon>
      </div>
      <span class="inner_text">User</span>
    </ion-tab-button>
   
  </ion-tab-bar>
</ion-tabs>
