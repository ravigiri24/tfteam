<ion-content class="ion-padding internal_card_container" [ngClass]="listColorClass">
  <div class="border-shape bottom_small_popup">
    <div class="global_input_block">
      <ion-input label="Enter Percent"  fill="outline" labelPlacement="stacked" type="number"
        [(ngModel)]="percent_0f_payout"></ion-input>

    </div>
    <div class="page_submit_btn">
      <ion-button (click)="updateTractor()" class="global_submit_color_button dynamic_bgcolor"
        expand="block">Update</ion-button>
    </div>
  </div>
</ion-content>
