<ion-content class="ion-padding internal_card_container">
  <div class="bottom_small_popup">
    <div class="global_input_block ">
      <ion-select (ionChange)="updateNoc()" [(ngModel)]="nocRequired" fill="outline" label="Noc Required"
        label-placement="type">
        <ion-select-option [value]="true">Yes</ion-select-option>
        <ion-select-option [value]="false">No</ion-select-option>
      </ion-select>
    </div>
  </div>
</ion-content>
