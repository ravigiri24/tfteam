<ion-header>  
  <ion-toolbar>  
    <ion-title *ngIf="!data">Add New Finding</ion-title>  
    <ion-title *ngIf="data " >Update</ion-title>  

    <!-- <ion-icon name='close-circle' (click)='dismiss()' style='float: right;'></ion-icon>   -->
    <ion-buttons slot="end">
      <ion-icon class="theme-color icon-size"  (click)="dismiss()" name="close-circle-outline"></ion-icon>
    </ion-buttons>
  </ion-toolbar>  
</ion-header>  
<ion-content class="ion-padding">
<form [formGroup]="newFindingForms">


  
        
        <div class="global_input_block">
      <ion-input label="Deal Date" fill="outline" labelPlacement="stacked" type="date"
        formControlName="deal_date"></ion-input>
    </div>


      
  
        <div class="global-inner-heading">
      <span>Select Dealer           <ion-icon (click)="openCrudManagement('DEALER_LIST')" name="add-circle-outline"></ion-icon>
              <ion-icon (click)="getDealerList(true)" name="refresh-outline"></ion-icon></span>

    </div>
    <div class="global_input_block global_location_block" (click)="selectItem(dealerList,'Dealer/Bank','dealer_list')">

    <span class="top_layers">Dealer/Bank</span>
    <span class="name_selected">{{dealerName}}</span>
    <ion-icon class="arrow_right" name="caret-down-outline"></ion-icon>

     
  </div>
 

    
   

  <div class="login-button">
  
    <ion-button *ngIf="!data" (click)="saveForm()"  style="text-align: center;" expand="block" >Save</ion-button>
    <ion-button *ngIf="data" (click)="updateForm()"  style="text-align: center;" expand="block" >Update</ion-button>
  </div>
  </form>
</ion-content>
