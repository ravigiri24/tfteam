<ion-header [ngClass]="listColorClass">
  <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">
        <span class="selected_text" *ngIf="!data">Add Estimation</span>
        <span class="selected_text" *ngIf="data">Update Estimation</span>
      </div>
      <div class="right_action">
        <ion-icon (click)="dismiss()" class="dynamic_color" name="close-circle-outline"></ion-icon>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding internal_card_container" [ngClass]="listColorClass">
  <form [formGroup]="form">
    <div class="global_input_block select_option_with_add">      
      <ion-select formControlName="cost_estimation_id" fill="outline" label="Expense Type" label-placement="stacked">
        <ion-select-option *ngFor="let type of expenseTypeList" [value]="type.id"> {{ type?.name }}</ion-select-option>
      </ion-select>
      <div class="right_action_block add_icon dynamic_bgcolor">
        <ion-icon (click)="openCrudManagement('NEW_FINDING_COST_ESTIMATION_HEADING')"
          name="add-circle-outline"></ion-icon>
      </div>
      <div class="right_action_block refresh_icon">
        <ion-icon (click)="getExpense()" name="refresh-outline"></ion-icon>
      </div>
 
    </div>
    <div class="global_input_block">
      <ion-input label="Expense Amount" fill="outline" labelPlacement="stacked" type="number"
        formControlName="cost_value"></ion-input>
    </div>
 
    <div class="page_submit_btn">
      <ion-button *ngIf="!data" (click)="saveExpense()" class="global_submit_color_button dynamic_bgcolor" expand="block">Save</ion-button>
      <ion-button *ngIf="data" (click)="updateItem()" class="global_submit_color_button dynamic_bgcolor" expand="block">Update</ion-button>
    </div>
  </form>
</ion-content>
