        <ion-tab-button tab="Job-dashboard" (click)="goToPage('Job-dashboard')" [class.active]="selectedTab === 'Job-dashboard'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'Job-dashboard'">
        <ion-icon name="cellular-outline" *ngIf="selectedTab !== 'Job-dashboard'"></ion-icon>
        <ion-icon name="cellular" *ngIf="selectedTab === 'Job-dashboard'"></ion-icon>
      </div>
      <span class="inner_text">Dashboard</span>
    </ion-tab-button>

     <ion-tab-button tab="Job-dashboard" (click)="goToPage('Job-List')" [class.active]="selectedTab === 'Job-List'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'Job-List'">
        <ion-icon name="receipt-outline" *ngIf="selectedTab !== 'Job-List'"></ion-icon>
        <ion-icon name="receipt" *ngIf="selectedTab === 'Job-List'"></ion-icon>
      </div>
      <span class="inner_text">Jobs</span>
    </ion-tab-button>

       <ion-tab-button tab="Reports" (click)="goToPage('Reports')" [class.active]="selectedTab === 'Reports'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'Reports'">
        <ion-icon name="document-text-outline" *ngIf="selectedTab !== 'Reports'"></ion-icon>
        <ion-icon name="document-text" *ngIf="selectedTab === 'Reports'"></ion-icon>
      </div>
      <span class="inner_text">Reports</span>
    </ion-tab-button>
    <ion-tab-button tab="User" (click)="goToPage('User')" [class.active]="selectedTab === 'User'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'User'">
        <ion-icon name="person-circle-outline" *ngIf="selectedTab !== 'User'"></ion-icon>
        <ion-icon name="person-circle" *ngIf="selectedTab === 'User'"></ion-icon>
      </div>
