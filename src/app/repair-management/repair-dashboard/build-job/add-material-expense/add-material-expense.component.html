<ion-header>
  <ion-toolbar>
    <ion-title class="ame-title">Add Material</ion-title>
    <ion-buttons slot="end">
      <button class="ame-icon-btn" *ngIf="addedItems?.length > 0 && !editData" type="button" (click)="openAddedItemList()" aria-label="View added items">
        <ion-icon name="list-outline"></ion-icon>
        <span class="ame-badge">{{addedItems?.length||0}}</span>
      </button>
      <button class="ame-icon-btn" type="button" (click)="openCrudManagement('CATEGOEY_OF_MATERIAL')" aria-label="Add category">
        <ion-icon name="pricetags-outline"></ion-icon>
      </button>
      <button class="ame-icon-btn" type="button" (click)="openCrudManagement('MATERIAL_OF_REPAIRING')" aria-label="Add material">
        <ion-icon name="add-outline"></ion-icon>
      </button>
      <button class="ame-icon-btn ame-close-btn" type="button" (click)="dismiss()" aria-label="Close">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
  <div class="ame-header-art">
    <span class="ame-orb ame-orb-one"></span>
    <span class="ame-orb ame-orb-two"></span>
  </div>
</ion-header>
<ion-content class="ion-padding ame-content">
  <ion-searchbar *ngIf="!selectedItem?.name" [(ngModel)]="search.name" class="ame-searchbar" placeholder="Search Spare"></ion-searchbar>
  <div class="ame-search-wrap" *ngIf="!selectedItem?.name">
    <ion-list class="ame-search-list" *ngIf="(materialList | filterBy: search).length">
      <ion-item class="ame-search-item" (click)="setValue(expense)" *ngFor="let expense of materialList| filterBy: search ;let in=index">
        <ion-icon name="cube-outline"></ion-icon>
        <ion-label>
          <h2>{{expense?.name}}</h2>
        </ion-label>
      </ion-item>
    </ion-list>
    <div class="ame-not-found" *ngIf="(materialList | filterBy: search).length === 0">
      <small>In this spare part not found, do you want add this one.</small>
      <button class="ame-add-new-btn" type="button" (click)="addNewService()">Add New Spare Part</button>
    </div>
  </div>

  <div class="ame-selected-block" *ngIf="selectedItem?.name">
    <form [formGroup]="form">
      <div class="ame-selected-row">
        <div class="ame-selected-text">
          <span>Selected Spare :</span>
          <span class="ame-selected-value">{{selectedItem?.name}}</span>
        </div>
        <button class="ame-change-btn" type="button" (click)="changeSpare()" aria-label="Change spare">
          <ion-icon name="swap-horizontal-outline"></ion-icon>
        </button>
      </div>
      <div class="global_input_block ame-input-block" *ngIf="selectedItem?.name && !selectedItem?.id">
        <ion-select (ionChange)="setSpareCategory($event)" fill="outline" label="Select Category*" label-placement="type">
          <ion-select-option *ngFor="let spare of spareList" [value]="spare?.id">{{spare?.name}}</ion-select-option>
        </ion-select>
      </div>
      <div class="global_input_block ame-input-block">
        <ion-input label="Amount" fill="outline" labelPlacement="stacked" type="number"
          formControlName="expense_amount"></ion-input>
      </div>
      <div class="global_input_block ame-input-block">
        <ion-input label="Quantity" fill="outline" labelPlacement="stacked" type="number"
          formControlName="qty"></ion-input>
      </div>
      <button class="ame-submit-btn" type="button" *ngIf="!editData" (click)="saveData()">Add</button>
      <button class="ame-submit-btn" type="button" *ngIf="editData" (click)="updateData()">Update</button>
    </form>
  </div>
</ion-content>
