<ion-header>
  <ion-toolbar>
    <ion-title class="asc-title">Add Service</ion-title>
    <ion-buttons slot="end">
      <button class="asc-icon-btn" *ngIf="addedItems?.length > 0 && !editData" type="button" (click)="openAddedItemList()" aria-label="View added items">
        <ion-icon name="list-outline"></ion-icon>
        <span class="asc-badge">{{addedItems?.length||0}}</span>
      </button>
      <button class="asc-icon-btn" type="button" (click)="openCrudManagement('TYPE_OF_REPAIRING_EXPENSE')" aria-label="Add service type">
        <ion-icon name="add-outline"></ion-icon>
      </button>
      <button class="asc-icon-btn asc-close-btn" type="button" (click)="dismiss()" aria-label="Close">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
  <div class="asc-header-art">
    <span class="asc-orb asc-orb-one"></span>
    <span class="asc-orb asc-orb-two"></span>
  </div>
</ion-header>
<ion-content class="ion-padding asc-content">
  <ion-searchbar *ngIf="!selectedItem?.name" [(ngModel)]="search.name" class="asc-searchbar" placeholder="Search Service"></ion-searchbar>
  <div class="asc-search-wrap" *ngIf="!selectedItem?.name">
    <ion-list class="asc-search-list" *ngIf="(expenseTypeList | filterBy: search).length">
      <ion-item class="asc-search-item" (click)="setValue(expense)" *ngFor="let expense of expenseTypeList| filterBy: search ;let in=index">
        <ion-icon name="construct-outline"></ion-icon>
        <ion-label>
          <h2>{{expense?.name}}</h2>
        </ion-label>
      </ion-item>
    </ion-list>
    <div class="asc-not-found" *ngIf="(expenseTypeList | filterBy: search).length === 0">
      <small>In this service not found, do you want add this one.</small>
      <button class="asc-add-new-btn" type="button" (click)="addNewService()">Add New Service</button>
    </div>
  </div>

  <div class="asc-selected-block" *ngIf="selectedItem?.name">
    <form [formGroup]="form">
      <div class="asc-selected-row">
        <div class="asc-selected-text">
          <span>Selected Service :</span>
          <span class="asc-selected-value">{{selectedItem?.name}}</span>
        </div>
        <button class="asc-change-btn" type="button" (click)="changeService()" aria-label="Change service">
          <ion-icon name="swap-horizontal-outline"></ion-icon>
        </button>
      </div>
      <div class="global_input_block asc-input-block">
        <ion-input label="Amount" fill="outline" labelPlacement="stacked" type="number"
          formControlName="expense_amount"></ion-input>
      </div>
      <button class="asc-submit-btn" type="button" *ngIf="!editData" (click)="saveData()">Add Service</button>
      <button class="asc-submit-btn" type="button" *ngIf="editData" (click)="updateData()">Update Service</button>
    </form>
  </div>
</ion-content>
