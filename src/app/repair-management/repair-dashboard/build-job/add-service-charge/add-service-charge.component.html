<ion-header [ngClass]="listColorClass">
  <ion-toolbar>
    <ion-title>Add Service</ion-title>
    <ion-buttons slot="end">
      <ion-icon class="button-right-margin theme-color" (click)="openCrudManagement('TYPE_OF_REPAIRING_EXPENSE')"
        name="add-circle-outline"></ion-icon>
      <ion-icon class="dynamic_color icon-size" (click)="dismiss()" name="close-circle-outline"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="page_inner_container ion-padding" [ngClass]="listColorClass">
  <ion-searchbar (ionFocus)="onInputFocus()" (ionBlur)="focusOut()" [(ngModel)]="search.name" slot="fixed"
    placeholder="Search Service"></ion-searchbar>
  <div [ngClass]="{'searchList':showSearchList==true}">
    <ion-content>
      <ion-list *ngIf="showSearchList" class="list_row">
        <ion-item (click)="setValue(expense)" *ngFor="let expense of expenseTypeList| filterBy: search ;let in=index">
          <ion-label>
            <h2>{{expense?.name}}</h2>
          </ion-label>
        </ion-item>
      </ion-list>
      <div class="not_found_block" *ngIf="(expenseTypeList | filterBy: search).length === 0">
        <small>In this service not found, do you want add this one.</small>
        <ion-button (click)="addNewService()" class="dynamic_bgcolor">
          <span class="color-white">Add New Service</span></ion-button>
      </div>
    </ion-content>
  </div>


  <div class="service_selected_amount_block" *ngIf="selectedItem?.name">
    <form [formGroup]="form">
      <span class="inner-heading"><span>Selected Service : </span><span>{{selectedItem?.name}}</span></span>
      <div class="global_input_block">
        <ion-input label="Amount" fill="outline" labelPlacement="stacked" type="number"
          formControlName="expense_amount"></ion-input>
      </div>
      <div class="global_submit_button">
        <ion-button *ngIf="!editData" (click)="saveData()" class="dynamic_bgcolor" expand="block"><span
            class="color-white">Add Service</span></ion-button>
        <ion-button *ngIf="editData" (click)="updateData()" class="dynamic_bgcolor" expand="block"><span
            class="color-white">Update Service</span></ion-button>
      </div>
    </form>
  </div>
