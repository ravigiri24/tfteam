<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <button class="rd-back-btn" type="button" (click)="backToSrcPage()" aria-label="Back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title class="rd-title">Tractor Dashboard</ion-title>
  </ion-toolbar>
  <div class="rd-header-art">
    <span class="rd-orb rd-orb-one"></span>
    <span class="rd-orb rd-orb-two"></span>
  </div>
</ion-header>
<ion-content class="ion-padding rd-content">
  <div class="rd-tab-bar">
    <button class="rd-tab-btn" [class.rd-tab-active]="selectedTab === 'DETAILS'" type="button"
      (click)="goToPage('DETAILS')">
      <ion-icon name="document-text-outline"></ion-icon>
      <span>Details</span>
    </button>
    <button class="rd-tab-btn" [class.rd-tab-active]="selectedTab === 'GALLERY'" type="button"
      (click)="goToPage('GALLERY')">
      <ion-icon name="images-outline"></ion-icon>
      <span>Gallery</span>
    </button>
    <button class="rd-tab-btn" *ngIf="!isJobDone" [class.rd-tab-active]="selectedTab === 'BUILD'" type="button"
      (click)="goToPage('BUILD')">
      <ion-icon name="construct-outline"></ion-icon>
      <span>Build Job</span>
    </button>
    <button class="rd-tab-btn" [class.rd-tab-active]="selectedTab === 'JOB_CARD'" type="button"
      (click)="goToPage('JOB_CARD')">
      <ion-icon name="receipt-outline"></ion-icon>
      <span>Job Card</span>
    </button>
  </div>
  <div class="tab_withinner_block">
    <ng-container *ngIf="selectedTab === 'DETAILS'">
      <app-job-detail [inventoryArray]="inventoryArray" [issueArray]="issueArray" [inventoryList]="inventoryList"
        [issueList]="issueList" *ngIf="loadAllData" [jobDetails]="jobDetails" [isJobDone]="isJobDone"></app-job-detail>
    </ng-container>
    <ng-container *ngIf="selectedTab === 'GALLERY'">
      <app-image-dashboard [beforeService]="beforeService" (reloadImage)="getRawImages(true)"
        [afterService]="afterService" [jobArray]="jobArray" *ngIf="!imageLoader" [imageArray]="imageArray"
        [jobDetails]="jobDetails" [isJobDone]="isJobDone"></app-image-dashboard>
    </ng-container>
    <ng-container class="hieght-body" *ngIf="selectedTab === 'BUILD' && !isJobDone">
      <app-build-job (refreshMaterailList)="getMaterialList(true)" [materialList]="materialList" (refreshServiceList)="getServiceList(true)"
        (refreshReducelList)="getReduceList(true)"
        *ngIf="jobDetails && !serviceLoader && !materialLoader  && !reduceLoader"
        [expenseServiceList]="expenseServiceList"    [spareList]="spareList" [jobDetails]="jobDetails" [reduceItemList]="reduceItemList"
        [expenseMaterialList]="expenseMaterialList" [prdeictionMaterialList]="prdeictionMaterialList"
        [isJobDone]="isJobDone"></app-build-job>
    </ng-container>
    <ng-container class="hieght-body" *ngIf="selectedTab === 'JOB_CARD'">
      <app-job-card [expenseServiceList]="expenseServiceList" [jobDetails]="jobDetails"
        [expenseMaterialList]="expenseMaterialList" [reopenedHistory]="reopenedHistory" [expenseMaterialCost]="expenseMaterialCost"
        [reduceItemTotalAmount]="reduceItemTotalAmount" [reduceItemList]="reduceItemList" [isJobDone]="isJobDone"
        [expenseServiceCost]="expenseServiceCost" [spareList]="spareList" [materialList]="materialList"
        [categroyWiseMaterial]="categroyWiseMaterial"
        *ngIf="jobDetails && !serviceLoader && !materialLoader && !reduceLoader"></app-job-card>
    </ng-container>
  </div>
</ion-content>
