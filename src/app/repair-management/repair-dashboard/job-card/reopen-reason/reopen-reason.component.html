<ion-header [ngClass]="listColorClass">
  <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">
         Reason
      </div>
      <div class="right_action">
        <ion-icon class="dynamic_color" (click)="dismiss()" name="close"></ion-icon>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding internal_card_container" [ngClass]="listColorClass">
  <div class="border-shape background">

    <div class="global_input_block">
      <ion-textarea [(ngModel)]="reason" class="global_textarea" label="reason" fill="outline" labelPlacement="stacked"
        placeholder="write reason here..."></ion-textarea>
    </div>
    <div class="page_submit_btn">
      <ion-button (click)="reopen()" class="global_submit_color_button dynamic_bgcolor" expand="block">Save</ion-button>

    </div>
  </div>
</ion-content>
