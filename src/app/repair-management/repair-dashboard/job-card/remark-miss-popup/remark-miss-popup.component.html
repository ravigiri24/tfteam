<ion-header>
  <ion-toolbar>
    <ion-title class="rmp-title">Add Remark (Miscellaneous)</ion-title>
    <ion-buttons slot="end">
      <button class="rmp-close-btn" type="button" (click)="dismiss()" aria-label="Close">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
  <div class="rmp-header-art">
    <span class="rmp-orb rmp-orb-one"></span>
    <span class="rmp-orb rmp-orb-two"></span>
  </div>
</ion-header>
<ion-content class="ion-padding rmp-content">
  <div class="global_input_block">
    <ion-textarea [(ngModel)]="miscellaneous_remark" label="Remark" class="global_textarea" fill="outline" labelPlacement="stacked"
      placeholder="write remark (Miss) here..."></ion-textarea>
  </div>
  <button class="rmp-submit-btn" type="button" (click)="deleteTractor()">Save</button>
</ion-content>
