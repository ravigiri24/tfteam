<ion-header [ngClass]="listColorClass">
  <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">
        Service Costing
      </div>
      <div class="right_action">
        <ion-icon class="dynamic_color" (click)="dismiss()" name="close"></ion-icon>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding internal_card_container" [ngClass]="listColorClass">
    <form [formGroup]="form" *ngIf="form">
  <div class="border-shape background">

      <div class="global_input_block">
      <ion-input label="Enter Total Bill" fill="outline" labelPlacement="stacked" type="number"
        placeholder="Enter Total Bill" formControlName="totalBillService"></ion-input>
    </div>
        <div class="global_input_block">
      <ion-input label="Discount" fill="outline" labelPlacement="stacked" type="number"
        placeholder="Discount" formControlName="DiscountService"></ion-input>
    </div>
     
      <div class="global_input_block">
      <ion-input label="Net Pay" fill="outline" labelPlacement="stacked" type="number"
        placeholder="Net Pay" formControlName="NetPayService"></ion-input>
    </div>
       <div class="global_input_block">
      <ion-input label="Profit" fill="outline" labelPlacement="stacked" type="number"
        placeholder="Profit" formControlName="ProfitService"></ion-input>
    </div>
    <div class="page_submit_btn">
      <ion-button (click)="update()" class="global_submit_color_button dynamic_bgcolor" expand="block">Save</ion-button>

    </div>
  </div>
  </form>
</ion-content>
