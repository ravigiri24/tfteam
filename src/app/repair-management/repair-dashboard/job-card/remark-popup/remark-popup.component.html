<ion-header>
  <ion-toolbar>
    <ion-title class="rp-title">Add Remark</ion-title>
    <ion-buttons slot="end">
      <button class="rp-close-btn" type="button" (click)="dismiss()" aria-label="Close">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
  <div class="rp-header-art">
    <span class="rp-orb rp-orb-one"></span>
    <span class="rp-orb rp-orb-two"></span>
  </div>
</ion-header>
<ion-content class="ion-padding rp-content">
  <div class="global_input_block">
    <ion-textarea [(ngModel)]="remark" class="global_textarea" label="Remark" fill="outline" labelPlacement="stacked"
      placeholder="write remark here..."></ion-textarea>
  </div>
  <button class="rp-submit-btn" type="button" (click)="deleteTractor()">Save</button>
</ion-content>
