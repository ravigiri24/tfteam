<div class="idb-wrap">
  <div class="idb-section">
    <div class="idb-section-label">
      <span>Before Service</span>
      <button class="idb-add-btn" *ngIf="!this.isJobDone" type="button" (click)="viewImage('BEFORE_SERVICE')" aria-label="Add before-service image">
        <ion-icon name="add-outline"></ion-icon>
      </button>
    </div>
    <div class="idb-image-grid" *ngIf="beforeService?.length">
      <div class="idb-image-card" *ngFor="let photo of beforeService; index as position">
        <img [src]="photo?.imageUrlUrl" (click)="viewImageSingle(photo)" />
      </div>
    </div>
    <app-no-data-view *ngIf="!beforeService?.length" [title]="'No before service images found.'" [subtitleShow]="false"></app-no-data-view>
  </div>

  <div class="idb-section">
    <div class="idb-section-label">
      <span>After Service</span>
      <button class="idb-add-btn" *ngIf="!this.isJobDone" type="button" (click)="viewImage('AFTER_SERVICE')" aria-label="Add after-service image">
        <ion-icon name="add-outline"></ion-icon>
      </button>
    </div>
    <div class="idb-image-grid" *ngIf="afterService?.length">
      <div class="idb-image-card" *ngFor="let photo of afterService; index as position">
        <img [src]="photo?.imageUrlUrl" (click)="viewInSlider(photo,afterService)" />
      </div>
    </div>
    <app-no-data-view *ngIf="!afterService?.length" [title]="'No after service images found.'" [subtitleShow]="false"></app-no-data-view>
  </div>

  <div class="idb-section">
    <div class="idb-section-label">
      <span>Job Card</span>
      <button class="idb-add-btn" *ngIf="!this.isJobDone" type="button" (click)="viewImage('JOB_CARD')" aria-label="Add job-card image">
        <ion-icon name="add-outline"></ion-icon>
      </button>
    </div>
    <div class="idb-image-grid" *ngIf="jobArray?.length">
      <div class="idb-image-card" *ngFor="let photo of jobArray; index as position">
        <img [src]="photo?.imageUrlUrl" (click)="viewImageSingle(photo)" />
      </div>
    </div>
    <app-no-data-view *ngIf="!jobArray?.length" [title]="'No job card images found.'" [subtitleShow]="false"></app-no-data-view>
  </div>
</div>
