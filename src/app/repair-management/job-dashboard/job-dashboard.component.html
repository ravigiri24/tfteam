<ion-header>
  <ion-toolbar>
    <ion-title class="jd-title">Job Dashboard</ion-title>
    <ion-buttons slot="end">
      <button class="jd-action-btn" *ngIf="showRefurbish" type="button" (click)="createJob()">
        <ion-icon name="add-outline"></ion-icon>
        <span>Refurbish</span>
      </button>
      <button class="jd-action-btn" *ngIf="showService" type="button" (click)="createService()">
        <ion-icon name="add-outline"></ion-icon>
        <span>Service</span>
      </button>
    </ion-buttons>
  </ion-toolbar>
  <div class="jd-header-art">
    <span class="jd-orb jd-orb-one"></span>
    <span class="jd-orb jd-orb-two"></span>
  </div>
</ion-header>
<ion-content class="ion-padding jd-content">
  <div class="jd-grid">
    <div class="jd-stat-card jd-card-open" (click)="jobList(false)">
      <div class="jd-icon-wrap">
        <img class="jd-icon-img" src="././assets/images/3D/open.png" />
      </div>
      <div class="jd-stat-body">
        <span class="jd-stat-label">Open Jobs</span>
        <span class="jd-stat-value">{{jobData?.openJob}}</span>
      </div>
    </div>

    <div class="jd-stat-card jd-card-closed" (click)="jobList(true)">
      <div class="jd-icon-wrap">
        <img class="jd-icon-img" src="././assets/images/3D/close.png" />
      </div>
      <div class="jd-stat-body">
        <span class="jd-stat-label">Closed Job</span>
        <span class="jd-stat-value">{{jobData?.closeJob}}</span>
      </div>
    </div>

    <div class="jd-stat-card jd-card-deleted">
      <div class="jd-icon-wrap">
        <img class="jd-icon-img" src="././assets/images/3D/deleted.png" />
      </div>
      <div class="jd-stat-body">
        <span class="jd-stat-label">Deleted Jobs</span>
        <span class="jd-stat-value">{{jobData?.deletedJob}}</span>
      </div>
    </div>

    <div class="jd-stat-card jd-card-total">
      <div class="jd-icon-wrap">
        <img class="jd-icon-img" src="././assets/images/3D/total.png" />
      </div>
      <div class="jd-stat-body">
        <span class="jd-stat-label">Total Jobs</span>
        <span class="jd-stat-value">{{jobData?.openJob+jobData?.closeJob}}</span>
      </div>
    </div>
  </div>
</ion-content>
