<ion-header>
  <ion-toolbar class="reports-toolbar">
    <ion-title class="reports-title">Reports Hub</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="reports-content">
  <div class="page-header">
    <p class="page-subtitle">Select a report category</p>
  </div>

  <div class="cards-grid">
    <div class="report-card card-blue" (click)="masterSheet()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/google-sheets.png" />
      </div>
      <div class="card-label">Master Sheet</div>
    </div>

    <div class="report-card card-teal" (click)="workSheet()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/document.png" />
      </div>
      <div class="card-label">Work Report</div>
    </div>

    <div class="report-card card-orange" (click)="unsoldReport()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/tractor_report.png" />
      </div>
      <div class="card-label">Unsold Tractors</div>
    </div>

    <div class="report-card card-amber" (click)="unsoldReportSpecific()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/tractor_report.png" />
      </div>
      <div class="card-label">Unsold Spec</div>
    </div>

    <div class="report-card card-green" (click)="salesReport()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/market-analysis.png" />
      </div>
      <div class="card-label">Sale Report</div>
    </div>

    <div class="report-card card-purple" (click)="leadManagement()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/lead-generation.png" />
      </div>
      <div class="card-label">Lead Management</div>
    </div>

    <div class="report-card card-pink" (click)="storeManagement()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/store.png" />
      </div>
      <div class="card-label">Sales Manager</div>
    </div>

    <div class="report-card card-cyan" (click)="TeamManagement()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/partners.png" />
      </div>
      <div class="card-label">Terr. Manager</div>
    </div>

    <div class="report-card card-brown" (click)="goToSo()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/audience.png" />
      </div>
      <div class="card-label">Sales Officer</div>
    </div>

    <div class="report-card card-red" (click)="lastSeen()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/clock.png" />
      </div>
      <div class="card-label">Last Activity</div>
    </div>

    <div class="report-card card-slate" (click)="bufferList()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/report.png" />
      </div>
      <div class="card-label">Buffer Stock</div>
    </div>

    <div class="report-card card-lime" (click)="viewFindingReports()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/checklist.png" />
      </div>
      <div class="card-label">Findings</div>
    </div>

    <div class="report-card card-emerald" (click)="newFindingReports()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/checklist.png" />
      </div>
      <div class="card-label">Findings Report</div>
    </div>

    <div class="report-card card-navy" (click)="bookedTractorSheets()">
      <div class="card-icon-wrap">
        <img class="card-icon" src="././assets/images/booking.png" />
      </div>
      <div class="card-label">Booked Tractor</div>
    </div>
  </div>
</ion-content>
