<ion-header >
  <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">
        Add Staff
  
      </div>
      <div class="right_action">
  
        <ion-icon (click)="dismiss()" name="close"></ion-icon>
      </div>
    </ion-label>

  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <form *ngIf="form" [formGroup]="form">
     <div class="global_input_block">
        <ion-input label="Name" fill="outline" formControlName="name" labelPlacement="stacked" type="text" ></ion-input>
      </div>
           <div class="global_input_block">
        <ion-input label="Contact" fill="outline" formControlName="contact1" labelPlacement="stacked" type="number" ></ion-input>
      </div>
        <div class="global_input_block">
        <ion-input label="User ID" fill="outline" formControlName="userId" labelPlacement="stacked"  ></ion-input>
      </div>
             <div class="global_input_block">
        <ion-input label="User Password" fill="outline" formControlName="password" labelPlacement="stacked"  ></ion-input>
      </div>
              <div class="global_input_block">
        <ion-input label="Address" fill="outline" formControlName="address1" labelPlacement="stacked"  ></ion-input>
      </div>
           <div class="global_input_block">
           <ion-select label="Select Store"  fill="outline"   formControlName="storeId" 
        label-placement="type">
        <ion-select-option  *ngFor="let ware of warehouseList" [value]="ware.id"> {{ ware?.name }}</ion-select-option>
      </ion-select>
      </div>
        <div class="row" >
    <ion-button *ngIf="!editedData"  (click)="checkingUserId()" class="global_submit_button" >
    
      Add</ion-button>
          <ion-button (click)="checkingUserIdOnUpdate()" *ngIf="editedData"  class="global_submit_button" >
    
      Update</ion-button>
    </div>
  </form>
</ion-content>
