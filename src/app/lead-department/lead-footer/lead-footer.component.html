<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar {{activeTabsColor}}">
    <ion-tab-button tab="Customer" (click)="goToPage('CUSTOMER_LIST')" [class.active]="selectedTab === 'CUSTOMER_LIST'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'CUSTOMER_LIST'">
        <ion-icon name="people-outline" *ngIf="selectedTab !== 'CUSTOMER_LIST'"></ion-icon>
        <ion-icon name="people" *ngIf="selectedTab === 'CUSTOMER_LIST'"></ion-icon>
      </div>
      <span class="inner_text">Customer</span>
    </ion-tab-button>
    <ion-tab-button tab="Follow-Up" (click)="goToPage('Follow-Up')" [class.active]="selectedTab === 'Follow-Up'">
      <div class="icon-wrapper center-icon" [class.selected]="selectedTab === 'Follow-Up'">
        <ion-icon name="bookmarks-outline" *ngIf="selectedTab !== 'Follow-Up'"></ion-icon>
        <ion-icon name="bookmarks" *ngIf="selectedTab === 'Follow-Up'"></ion-icon>
      </div>
      <span class="inner_text">Tracking</span>
    </ion-tab-button>
      <ion-tab-button tab="Status" (click)="goToPage('Visitng')" [class.active]="selectedTab === 'Visitng'">
      <div class="icon-wrapper center-icon" [class.selected]="selectedTab === 'Visitng'">
        <ion-icon name="prism-outline" *ngIf="selectedTab !== 'Visitng'"></ion-icon>
        <ion-icon name="prism" *ngIf="selectedTab === 'Visitng'"></ion-icon>
      </div>
      <span class="inner_text">Visiting</span>
    </ion-tab-button>
    <ion-tab-button tab="User" (click)="goToPage('User')" [class.active]="selectedTab === 'User'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'User'">
        <ion-icon name="person-circle-outline" *ngIf="selectedTab !== 'User'"></ion-icon>
        <ion-icon name="person-circle" *ngIf="selectedTab === 'User'"></ion-icon>
      </div>
      <span class="inner_text">User</span>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
