<ion-content class="ion-padding internal_card_container">
  <div class="bottom_small_popup">
    <div class="global_input_block ">
      <ion-select (ionChange)="selectFilter()" [(ngModel)]="selectedRole" fill="outline" label="Select Role"
        label-placement="type">
        <ion-select-option *ngFor="let role of roles" [value]="role">{{role}}</ion-select-option>
      </ion-select>
    </div>
  </div>
</ion-content>
