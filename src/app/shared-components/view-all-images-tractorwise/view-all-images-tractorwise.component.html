<ion-header [ngClass]="listColorClass">
   <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">
        <span class="selected_text">View All Image</span>
      </div>
      <div class="right_action">
        <ion-icon class="dynamic_color icon-size" (click)="dismiss()" name="close-circle-outline"></ion-icon>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding global_bgpopup_container" [ngClass]="listColorClass">
<div class="top-position" [ngClass]="listColorClass">
  <div class="global-inner-heading dynamic_color">
    <span>Before Service (Maintainance)</span>
    <!-- <ion-icon   class="dynamic_color icon-size-add"
      name="add-circle-outline"></ion-icon> -->
  </div>
  <div class="dynamic_block" *ngIf="beforeService?.length">
    <div class="main_card_block" *ngFor="let photo of beforeService; index as position">
      <ion-card>
        <img class="image_upload_card" (click)="viewInSlider(photo,beforeService)" [src]="photo?.imageUrlUrl" />
      </ion-card>
    </div>
  </div>
  <div class="dynamic_block no_found_dynamic_block" *ngIf="!beforeService?.length">
    <app-no-data-view class="image_record_minwidth" [title]="'No images found.'" [subtitleShow]="false"></app-no-data-view>
  </div>
  <div class="global-inner-heading dynamic_color">
    <span>After Service (Maintainance)</span>
    <!-- <ion-icon  class="dynamic_color icon-size-add"
      name="add-circle-outline"></ion-icon> -->
  </div>
  <div class="dynamic_block" *ngIf="afterService?.length">
    <div class="main_card_block" *ngFor="let photo of afterService; index as position">
      <ion-card>
        <img class="image_upload_card" (click)="viewInSlider(photo,afterService)" [src]="photo?.imageUrlUrl" />
      </ion-card>
    </div>
  </div>
  <div class="dynamic_block no_found_dynamic_block" *ngIf="!afterService?.length">
    <app-no-data-view class="image_record_minwidth" [title]="'No images found.'" [subtitleShow]="false"></app-no-data-view>
  </div>
 <div class="global-inner-heading dynamic_color">
    <span>At Purchase / Receiving</span>
    <!-- <ion-icon   class="dynamic_color icon-size-add"
      name="add-circle-outline"></ion-icon> -->
  </div>
  <div class="dynamic_block" *ngIf="purchaseTimeList?.length">
    <div class="main_card_block" *ngFor="let photo of purchaseTimeList; index as position">
      <ion-card>
        <img class="image_upload_card" (click)="viewInSlider(photo,purchaseTimeList)" [src]="photo?.imageUrlUrl" />
      </ion-card>
    </div>
  </div>
  <div class="dynamic_block no_found_dynamic_block" *ngIf="!purchaseTimeList?.length">
    <app-no-data-view  class="image_record_minwidth" [title]="'No  images found '" [subtitleShow]="false"></app-no-data-view>
  </div>
  <div class="global-inner-heading dynamic_color">
    <span>Live Images</span>
    <!-- <ion-icon class="dynamic_color icon-size-add"
      name="add-circle-outline"></ion-icon> -->
  </div>
  <div class="dynamic_block" *ngIf="liveImages?.length">
    <div class="main_card_block" *ngFor="let photo of liveImages; index as position">
      <ion-card>
        <img class="image_upload_card" (click)="viewInSlider(photo,liveImages)" [src]="photo?.imageUrlUrl" />
      </ion-card>
    </div>
  </div>
  <div class="dynamic_block no_found_dynamic_block" *ngIf="!liveImages?.length">
    <app-no-data-view  class="image_record_minwidth" [title]="'No  images found'" [subtitleShow]="false"></app-no-data-view>
  </div> 
    <div class="global-inner-heading dynamic_color">
    <span>Received At Store</span>
    <!-- <ion-icon class="dynamic_color icon-size-add"
      name="add-circle-outline"></ion-icon> -->
  </div>
  <div class="dynamic_block" *ngIf="receiveTractorList?.length">
    <div class="main_card_block" *ngFor="let photo of receiveTractorList; index as position">
      <ion-card>
        <img class="image_upload_card" (click)="viewInSlider(photo,receiveTractorList)" [src]="photo?.imageUrlUrl" />
      </ion-card>
    </div>
  </div>
  <div class="dynamic_block no_found_dynamic_block" *ngIf="!receiveTractorList?.length">
    <app-no-data-view  class="image_record_minwidth" [title]="'No  images found'" [subtitleShow]="false"></app-no-data-view>
  </div>   
</div>
</ion-content>
