<!-- Shared remarks conversation -->
<div class="chat-shell">
  <div class="conversation-list">
    <div class="empty-chat" *ngIf="!chatHistory?.length"><span><ion-icon name="chatbubble-ellipses-outline"></ion-icon></span><h3>No remarks yet</h3><p>Start the conversation by adding the first message.</p></div>
    <article class="message" *ngFor="let chat of chatHistory" [class.own-message]="chat?.employeId == staffDetails?.staffCode">
      <div class="avatar">{{ (chat?.staffDetails?.name || 'U').charAt(0) | uppercase }}</div>
      <div class="message-content">
        <div class="message-meta"><strong>{{ chat?.staffDetails?.name || 'Team member' }}</strong><time>{{ chat?.createdOn }}</time></div>
        <p>{{ chat?.status }}</p>
      </div>
    </article>
  </div>

  <form class="composer" [formGroup]="form" (ngSubmit)="onSave()">
    <div class="composer-input"><ion-icon name="chatbox-ellipses-outline"></ion-icon><textarea rows="1" placeholder="Write a remark..." formControlName="status" aria-label="Remark message"></textarea></div>
    <button class="send-button" type="submit" [disabled]="loader || form.invalid" aria-label="Send remark">
      <ion-spinner *ngIf="loader" name="crescent"></ion-spinner><ion-icon *ngIf="!loader" name="send"></ion-icon>
    </button>
  </form>
</div>
