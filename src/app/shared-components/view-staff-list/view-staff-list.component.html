<!-- <ion-searchbar class="search_bar_row" *ngIf="showSearch" [(ngModel)]="search[searchKey]" slot="fixed"
  placeholder="Enter TF Code"></ion-searchbar> -->
  <ion-searchbar class="search_bar_row" [(ngModel)]="searchText"
  placeholder="Search Staff"></ion-searchbar>
<ion-list class="list_row top-position-list" *ngIf="list?.length">
  <!-- <ion-item *ngFor="let customer of list|filterBy: search ;let in=index"> -->
  <ion-row>
    <ion-col *ngFor="let staff of list | search:searchText; ; let i=index" size="12" size-md="6">
      <!-- <img  (click)="viewImage(customer)" style="width: 100%;max-height: 186px;padding: 8px;max-width: 200px;" [src]="customer?.imageUrlUrl" onerror="this.src='././assets/images/customer_display.png';"  /> -->
      <ion-grid class="main_block_details" [ngClass]="listColorClass">
        <ion-card>
   
          <ion-label class="main_title">{{staff?.name}}</ion-label>
          <!-- <ng-container >
          
              <ion-row>
                <ng-container >
                  <ion-col class="left_row_title">User ID</ion-col>
                  <ion-col class="amount_col">
                   {{staff?.userId}}</ion-col>
                </ng-container>
              
              </ion-row>
            <ion-row>
                <ng-container >
                  <ion-col class="left_row_title">Contact</ion-col>
                  <ion-col class="amount_col">
                   {{staff?.contact1}}</ion-col>
                </ng-container>
              
              </ion-row>
                 <ion-row>
                <ng-container >
                  <ion-col class="left_row_title">Store</ion-col>
                  <ion-col class="amount_col">
                   {{staff?.storeName}}</ion-col>
                </ng-container>
              
              </ion-row>
          </ng-container> -->
                <ng-container *ngFor="let keyValue of keyList; let i=index">
            <!-- <ng-container *ngIf="i < rowLineCount"> -->
            <ion-row>
              <ng-container *ngIf="keyValue?.type=='INPUT' && !keyValue?.getFromObj">
                <ion-col class="left_row_title">{{keyValue?.key}}</ion-col>
                <ion-col class="amount_col">
                  {{staff[keyValue?.value]}}</ion-col>
              </ng-container>
              <ng-container *ngIf="keyValue?.type=='INPUT' && keyValue?.getFromObj">
                <ion-col class="left_row_title">{{keyValue?.key}}</ion-col>
                <ion-col *ngIf="staff[keyValue?.objName]" class="amount_col">
                  {{staff[keyValue?.objName][keyValue?.value] || ""}}</ion-col>
              </ng-container>
              <ng-container *ngIf="keyValue?.type=='DATE'">
                <ion-col class="left_row_title">{{keyValue?.key}}</ion-col>
                <ion-col class="amount_col">
                  {{staff[keyValue?.value] |  date:'dd MMM yyyy, HH:mm' }}</ion-col>
              </ng-container>
              <ng-container *ngIf="keyValue?.type=='CONDITIONAL'">
                <ng-container *ngIf="!keyValue?.getFromObj">
                  <ion-col class="left_row_title">{{keyValue?.key}} </ion-col>
                  <ion-col *ngIf="staff[keyValue?.value]==1" class="amount_col">
                    <span style="color: green;">Yes</span> </ion-col>
                  <ion-col *ngIf="staff[keyValue?.value]==0" class="amount_col">
                    <span style="color: red;">No</span> </ion-col>
                  <ion-col *ngIf="staff[keyValue?.value]==null" class="amount_col">
                    <span style="color: red;">Not Availaible</span> </ion-col>
                </ng-container>
                <ng-container *ngIf="keyValue?.getFromObj">
                  <ion-col class="left_row_title">{{keyValue?.key}} </ion-col>
                  <ng-container *ngIf="staff[keyValue?.objName]">
                    <ion-col *ngIf="staff[keyValue?.objName][keyValue?.value]==1" class="amount_col">
                      <span style="color: green;">Yes</span> </ion-col>
                    <ion-col *ngIf="staff[keyValue?.objName][keyValue?.value]==0" class="amount_col">
                      <span style="color: red;">No</span> </ion-col>
                    <ion-col *ngIf="staff[keyValue?.objName][keyValue?.value]==null" class="amount_col">
                      <span style="color: red;">Not Availaible</span> </ion-col>
                  </ng-container>
                  <ng-container *ngIf="!staff[keyValue?.objName]">
                    <ion-col class="amount_col">
                      <span style="color: red;">Not Availaible</span> </ion-col>
                  </ng-container>
                </ng-container>
              </ng-container>
            </ion-row>
       
          </ng-container>
          <ion-row *ngIf="buttonArray?.length">
            <ion-col class="action_col" *ngFor="let button of buttonArray">
              <img (click)="actionEvent(staff,button,i)" [src]="button?.image" />
            </ion-col>
          </ion-row>
        </ion-card>
      </ion-grid>
    </ion-col>
  </ion-row>
  <!-- </ion-item> -->
</ion-list>

  <img class="image-no-data" src="././assets/images/no-data-found.png" />
</div> -->
<app-no-data-view [ngClass]="listColorClass" *ngIf="(list | filterBy: search)?.length === 0"></app-no-data-view>
