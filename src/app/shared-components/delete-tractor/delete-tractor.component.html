<ion-content class="ion-padding internal_card_container" [ngClass]="listColorClass">
  <div class="border-shape bottom_small_popup">
    <div class="global_input_block">
      <!-- <ion-input label="Enter Reason" fill="outline" labelPlacement="stacked" type="text"
        [(ngModel)]="deletedReason"></ion-input> -->
      <ion-textarea [(ngModel)]="deletedReason" label="Enter Reason" class="global_textarea" fill="outline"
        labelPlacement="stacked" placeholder="write delete reason here..."></ion-textarea>
    </div>
    <div class="page_submit_btn">
      <ion-button (click)="deleteTractor()" class="global_submit_color_button dynamic_bgcolor"
        expand="block">Delete</ion-button>
    </div>
  </div>
</ion-content>
