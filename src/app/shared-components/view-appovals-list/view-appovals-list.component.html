<ion-header [ngClass]="listColorClass">
  <ion-toolbar>
    <ion-title>
      <ion-select
        class="selected_ddl"
        (ionChange)="getingApprovalList()"
        [(ngModel)]="selectedType"
        label-placement="type"
      >
        <ion-select-option value="PENDING">Pending</ion-select-option>
        <ion-select-option value="APPROVED">Approved</ion-select-option>
        <ion-select-option value="REJECTED">Rejected</ion-select-option>
        <ion-select-option value="ALL">All</ion-select-option>
      </ion-select>
    </ion-title>
    <ion-buttons slot="end">
      <ion-icon
        class="icon-size dynamic_color"
        (click)="dismiss()"
        name="close-circle-outline"
      ></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content
  class="ion-padding internal_card_container"
  [ngClass]="listColorClass"
>
  <app-view-approval-list
    [listColorClass]="listColorClass"
    *ngIf="approvalList?.length"
    [approvalList]="approvalList"
    [showAction]="false"
    [showSummary]="false"
  ></app-view-approval-list>
  <app-no-data-view
    [ngClass]="listColorClass"
    *ngIf="!approvalList?.length && !share?.globalLoading"
  ></app-no-data-view>
</ion-content>
