<ion-header [ngClass]="listColorClass">
  <ion-toolbar class="top_heading">
    <div class="left_text">Search Tractor</div>
    <ion-buttons class="right_action" (click)="dismiss()" slot="end">
      <ion-icon class="dynamic_color icon-size" name="close-circle-outline"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="internal_card_container ion-padding" [ngClass]="listColorClass">
  <div class="search_with_btn select_option_with_add">
    <ion-searchbar [(ngModel)]="search.tfCode" slot="fixed" placeholder="Enter TF Code Ex: TF-123"></ion-searchbar>
    <ion-button class="dynamic_bgcolor" (click)="searchTractor()" expand="block">
      <ion-icon class="icon-size" name="search-outline"></ion-icon>
    </ion-button>
  </div>
  <!-- <span class="inner-heading-list top-margin-heading" *ngIf="tractorList?.length">Tractor</span> -->
  <ion-card class="popup_search_container" *ngIf="tractorList?.length">
    <app-view-list [listColorClass]="listColorClass"
      [buttonArray]="buttonArray" [keyList]="keyList" [list]="tractorList" [search]="searchFilter"
      (actionEventCall)="actionEvent($event)" [searchKey]="searchKey"></app-view-list>
  </ion-card>
