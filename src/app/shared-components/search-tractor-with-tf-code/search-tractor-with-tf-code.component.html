<!-- ── Header ── -->
<div class="st-header" [ngClass]="listColorClass">
  <div class="st-blob sb1"></div>
  <div class="st-blob sb2"></div>

  <div class="st-header-inner">
    <div class="st-header-icon">
      <ion-icon name="search-circle-outline"></ion-icon>
    </div>
    <div class="st-header-text">
      <span class="st-title">Search Tractor</span>
      <span class="st-sub">Find tractor by TF Code</span>
    </div>
    <button class="st-close-btn" (click)="dismiss()">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <svg class="st-wave" viewBox="0 0 400 24" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="M0,0 Q100,24 200,12 Q300,0 400,18 L400,24 L0,24 Z" fill="#e0f2f1"/>
  </svg>
</div>

<!-- ── Content ── -->
<ion-content class="st-content" [ngClass]="listColorClass">

  <!-- Search Card -->
  <div class="st-search-card">
    <div class="st-search-label">
      <ion-icon name="qr-code-outline"></ion-icon>
      <span>Enter TF Code</span>
    </div>
    <div class="st-search-row">
      <ion-searchbar [(ngModel)]="search.tfCode"
        placeholder="Ex: TF-123"
        class="st-searchbar"
        [debounce]="0"></ion-searchbar>
      <button class="st-search-btn" (click)="searchTractor()">
        <ion-icon name="search-outline"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Results -->
  <div class="st-results-card" *ngIf="tractorList?.length">
    <div class="st-results-label">
      <ion-icon name="list-outline"></ion-icon>
      <span>Results Found</span>
      <span class="st-results-count">{{ tractorList?.length }}</span>
    </div>
    <app-view-list
      [listColorClass]="listColorClass"
      [buttonArray]="buttonArray"
      [keyList]="keyList"
      [list]="tractorList"
      [search]="searchFilter"
      (actionEventCall)="actionEvent($event)"
      [searchKey]="searchKey">
    </app-view-list>
  </div>

</ion-content>
