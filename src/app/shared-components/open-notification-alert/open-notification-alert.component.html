<ion-header [ngClass]="listColorClass">
  <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">New Notifications</div>
      <div class="right_action">
        <ion-buttons slot="end">
          <ion-icon class="dynamic_color icon-size" (click)="dismiss()" name="close-circle-outline"></ion-icon>
        </ion-buttons>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding internal_card_container button_bottomfixed_row" [ngClass]="listColorClass">
  <div class="notification_container">
    <div class="notification_block">
      <div class="notification_icon">
        <ion-icon name="notifications-outline"></ion-icon>
      </div>
      <div class="notification_text">
        <span>Hey, You Have <span class="delete_color">{{count}}</span> New
          Notifications</span>
      </div>
    </div>
    <ion-footer class="bottom_fixed_buttons">
      <ion-row>
        <ion-col>
          <ion-button (click)="viewNotification()" class="global_submit_color_button dynamic_bgcolor"
            expand="block">View
            All Notification</ion-button>
        </ion-col>
        <ion-col>
          <ion-button (click)="markAsRead()" class="global_submit_color_button theme-bgcolor-secondary"
            expand="block">Mark
            As Read</ion-button>
        </ion-col>
      </ion-row>
    </ion-footer>
  </div>
</ion-content>
