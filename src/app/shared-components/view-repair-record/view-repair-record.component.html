<ion-header [ngClass]="listColorClass">
   <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">
        <span class="selected_text">Refurbish Record</span>
      </div>
      <div class="right_action">
        <ion-icon class="dynamic_color icon-size" (click)="dismiss()" name="close-circle-outline"></ion-icon>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
<ion-content class="internal_card_container" [ngClass]="listColorClass">
  <ion-card *ngIf="savedJobList?.length" class="table_block_details">
    <ion-row class="table_main_header dynamic_bgcolor">
      <ion-col class="sno_col">Sr</ion-col>
      <ion-col class="code_col">TF Code</ion-col>
      <ion-col class="date_col">Created</ion-col>
      <ion-col class="action_col">Action</ion-col>
    </ion-row>
    <ion-row class="table_row" *ngFor="let jobs of savedJobList;let i=index">
      <ion-col class="sno_col">{{i+1}}</ion-col>
      <ion-col class="code_col">{{jobs?.tfCode}}</ion-col>
      <ion-col class="date_col">{{jobs?.createdOn|date}}</ion-col>
      <ion-col class="action_col">
        <ion-icon class="delete_color icon-size" (click)="refurbishDetails(jobs)" name="eye-outline"></ion-icon>
      </ion-col>
    </ion-row>
  </ion-card>
  <app-no-data-view [ngClass]="listColorClass" *ngIf="!savedJobList?.length"></app-no-data-view>
  <!-- <div *ngIf="!savedJobList?.length" class="no-data-block">
    <img class="image-no-data" src="././assets/images/no-data-found.png" />
  </div> -->
</ion-content>
