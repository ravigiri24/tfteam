<ion-header [ngClass]="listColorClass">
  <ion-toolbar class="ff-toolbar">
    <div class="ff-header-inner">
      <div class="ff-header-left">
        <div class="ff-header-icon">
          <ion-icon name="options-outline"></ion-icon>
        </div>
        <div class="ff-header-text">
          <span class="ff-header-title">Apply Filter</span>
          <span class="ff-header-sub">Select year &amp; brands</span>
        </div>
      </div>
      <button class="ff-close-btn" (click)="dismiss()">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>
    <svg class="ff-wave" viewBox="0 0 400 24" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0,0 Q100,24 200,12 Q300,0 400,18 L400,24 L0,24 Z" fill="#f8f0ff"/>
    </svg>
  </ion-toolbar>
</ion-header>

<ion-content class="ff-content">
  <div class="ff-body" [ngClass]="listColorClass">

    <!-- ── Year Filter ── -->
    <div class="ff-section">
      <div class="ff-section-header">
        <ion-icon name="calendar-outline"></ion-icon>
        <span class="ff-section-title">Manufacturing Year</span>
        <span class="ff-selected-badge" *ngIf="yearChecked !== 'ALL'">{{ yearChecked }}</span>
      </div>

      <!-- hidden ion-radio-group keeps [(ngModel)] & (ionChange) intact -->
      <ion-radio-group [(ngModel)]="yearChecked" (ionChange)="selectItem($event)" class="ff-hidden-group">
        <ion-radio value="ALL"></ion-radio>
        <ion-radio value="2021 & Above"></ion-radio>
        <ion-radio value="2018-2020"></ion-radio>
        <ion-radio value="2014-2017"></ion-radio>
        <ion-radio value="2010-2013"></ion-radio>
        <ion-radio value="2000-2009"></ion-radio>
      </ion-radio-group>

      <!-- visual chips -->
      <div class="ff-chips-wrap">
        <div class="ff-chip" [class.ff-chip-active]="yearChecked === 'ALL'"         (click)="yearChecked = 'ALL'">All Years</div>
        <div class="ff-chip" [class.ff-chip-active]="yearChecked === '2021 & Above'" (click)="yearChecked = '2021 & Above'">2021 &amp; Above</div>
        <div class="ff-chip" [class.ff-chip-active]="yearChecked === '2018-2020'"    (click)="yearChecked = '2018-2020'">2018 – 2020</div>
        <div class="ff-chip" [class.ff-chip-active]="yearChecked === '2014-2017'"    (click)="yearChecked = '2014-2017'">2014 – 2017</div>
        <div class="ff-chip" [class.ff-chip-active]="yearChecked === '2010-2013'"    (click)="yearChecked = '2010-2013'">2010 – 2013</div>
        <div class="ff-chip" [class.ff-chip-active]="yearChecked === '2000-2009'"    (click)="yearChecked = '2000-2009'">2000 – 2009</div>
      </div>
    </div>

    <!-- ── Brand Filter ── -->
    <div class="ff-section">
      <div class="ff-section-header">
        <ion-icon name="pricetag-outline"></ion-icon>
        <span class="ff-section-title">Brands</span>
      </div>

      <div class="ff-chips-wrap">
        <div class="ff-chip" [class.ff-chip-active]="checkedAll"
             (click)="selectBrand({ detail: { checked: !checkedAll } }, 'ALL')">
          All
        </div>
        <div class="ff-chip" *ngFor="let brand of brandList"
             [class.ff-chip-active]="brand?.checked"
             (click)="selectBrand({ detail: { checked: !brand?.checked } }, brand)">
          {{ brand?.name }}
        </div>
      </div>
    </div>

  </div>
</ion-content>

<!-- ── Fixed Bottom Buttons ── -->
<div class="ff-footer">
  <button class="ff-btn ff-btn-reset" (click)="reset()">
    <ion-icon name="refresh-outline"></ion-icon>
    Reset
  </button>
  <button class="ff-btn ff-btn-apply" (click)="applyFilter()">
    <ion-icon name="checkmark-circle-outline"></ion-icon>
    Apply Filter
  </button>
</div>
