<ion-header [ngClass]="listColorClass">
  <ion-toolbar class="top_heading">
    <div class="left_text">Apply Filter</div>
    <ion-buttons class="right_action" (click)="dismiss()" slot="end">
      <ion-icon class="dynamic_color icon-size" name="close-circle-outline"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding filter_main_container">
  <div [ngClass]="listColorClass">
    <div class="global_input_block">
      <ion-select (ionChange)="selectList()" [(ngModel)]="listBy" fill="outline" label="List By" label-placement="type">
        <ion-select-option value="ALL">All</ion-select-option>
        <ion-select-option value="ACTIVE">Active</ion-select-option>
        <ion-select-option value="ARCHIVED">Archived</ion-select-option>
        <!-- <ion-select-option  *ngIf="showDate" value="BY_DATE">By Date</ion-select-option> -->
      </ion-select>
    </div>
    <div *ngIf="showFilter" class="global_input_block ">
      <ion-select (ionChange)="selectFilter()" [(ngModel)]="filterBy" fill="outline" label="{{filterByTitle}}"
        label-placement="type">
        <ion-select-option *ngFor="let options of optionsArray"
          [value]="options?.value">{{options?.displayName}}</ion-select-option>
      </ion-select>
    </div>
    <div class="global-inner-heading dynamic_color selected_show">Selected Year :<b>{{ yearChecked }}</b></div>
    <div class="radio_block_main_container">
      <ion-radio-group class="radio_block_container" [(ngModel)]="yearChecked" (ionChange)="selectItem($event)">
        <ion-radio class="radio_block dynamic_color" value="ALL" labelPlacement="end"><span
            class="name">All</span></ion-radio>
        <ion-radio class="radio_block dynamic_color" value="2021 & Above" labelPlacement="end"><span
            class="name">2021 &
            Above</span></ion-radio>
        <ion-radio class="radio_block dynamic_color" value="2018-2020" labelPlacement="end"><span
            class="name">2018 -2020
            </span></ion-radio>
        <ion-radio class="radio_block dynamic_color" value="2014-2017" labelPlacement="end">
          <span class="name">2014 -
            2017</span></ion-radio>
        <ion-radio class="radio_block dynamic_color" value="2010-2013" labelPlacement="end">
          <span class="name">2010 - 2013</span></ion-radio>
            <ion-radio class="radio_block dynamic_color" value="2000-2009" labelPlacement="end">
          <span class="name">2000 - 2009</span></ion-radio>
      </ion-radio-group>
      <!-- <p>Selected: {{ yearChecked }}</p> -->
    </div>
       <!-- <div class="global-inner-heading dynamic_color selected_show">Wheel Drive :<b>{{ wheeldrive }}</b></div>
    <div class="radio_block_main_container">
      <ion-radio-group class="radio_block_container" [(ngModel)]="wheeldrive" (ionChange)="selectWheel($event)">
        <ion-radio class="radio_block dynamic_color" value="ALL" labelPlacement="end"><span
            class="name">All</span></ion-radio>
        <ion-radio class="radio_block dynamic_color" value="2WD" labelPlacement="end"><span
            class="name">2WD
            Above</span></ion-radio>
        <ion-radio class="radio_block dynamic_color" value="4WD" labelPlacement="end"><span
            class="name">4WD
            Above</span></ion-radio>

      </ion-radio-group>
 
    </div> -->
    <div *ngIf="showRange" class="global-inner-heading dynamic_color">Price Range</div>
    <div class="range_block"><ion-range *ngIf="showRange" aria-label="Price Range" [dualKnobs]="true"
        [value]="{ lower: lower, upper: upper }" [min]="0" [max]="1500000" [step]="10000"
        (ionChange)="rangeChange($event)">
      </ion-range></div>
    <div class="label_main_block">
      <ion-label>Min: {{ rangeValue.lower }}</ion-label>
      <ion-label class="right_text">Max: {{ rangeValue.upper }}</ion-label>
    </div>
    <span class="global-inner-heading dynamic_color">Brands
      <!-- <ion-icon class="dynamic_color margin-set" (click)="openCrudManagement('TRACTOR_ISSUES')"
          name="add-circle-outline"></ion-icon> -->
    </span>
    <div class="multiple_options_container">
      <ion-checkbox class="checkbox_block dynamic_color" (ionChange)="selectBrand($event,'ALL')" [checked]="checkedAll"
        labelPlacement="end"><span class="name">All</span></ion-checkbox>
      <ion-checkbox class="checkbox_block dynamic_color" *ngFor="let brand of brandList" [checked]="brand?.checked"
        (ionChange)="selectBrand($event,brand)" labelPlacement="end"><span
          class="name">{{brand?.name}}</span></ion-checkbox>
    </div>
    <div class="bottom_fixed_buttons">
      <div class="row">
        <div class="col-6">
          <ion-button (click)="applyFilter()" class="global_submit_color_button dynamic_bgcolor"
            expand="block">Apply</ion-button>
        </div>
        <div class="col-6">
          <ion-button (click)="reset()" class="global_submit_color_button theme-bgcolor-secondary"
            expand="block">Reset</ion-button>
        </div>
      </div>
    </div>
