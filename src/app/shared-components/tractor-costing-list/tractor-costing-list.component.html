<app-common-header
  [selectedStore]="selectedStore"
  *ngIf="warehouseList?.length"
  class="app_common_header"
  [isListFilter]="true"
  [brandList]="brandList"
  [warehouseList]="warehouseList"
  [listColorClass]="listColorClass"
  [title]="'Tractors'"
  [list]="alltractorList"
  [showWareHouse]="true"
  [headerDisplayArray]="headerDisplayArray"
  (actionEventHeader)="actionEventHeader($event)"
  (selectWareHouseAction)="tractorListStorewise($event)"
></app-common-header>
