<ion-header class="review-header">
  <ion-toolbar>
    <div class="header-canvas" aria-hidden="true"><span class="orb orb-one"></span><span class="orb orb-two"></span><span class="glow-line line-one"></span><span class="glow-line line-two"></span></div>
    <div class="header-content">
      <div class="title-wrap">
        <span class="title-icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
        <div><span class="eyebrow">CUSTOMER CONVERSATION</span><h1>{{ showScheduleRamrk ? 'Remarks & Follow-up' : 'Chat History' }}</h1><p>{{ customer?.name || customer?.customerName || 'Customer' }}</p></div>
      </div>
      <ion-button class="close-button" fill="clear" aria-label="Close conversation" (click)="cancel()"><ion-icon slot="icon-only" name="close-outline"></ion-icon></ion-button>
    </div>
  </ion-toolbar>
  <form class="schedule-strip" [formGroup]="nextScheduleForm" *ngIf="showScheduleRamrk">
    <div class="schedule-copy"><span><ion-icon name="calendar-outline"></ion-icon></span><div><strong>Next follow-up</strong><small>Schedule your next conversation</small></div></div>
    <div class="date-control"><input type="date" aria-label="Next follow-up date" formControlName="next_lead_date" (change)="nextFollowupDate()" /><ion-icon name="chevron-down-outline"></ion-icon></div>
  </form>
</ion-header>

<ion-content class="review-content" [scrollY]="false">
  <div class="ambient-canvas" aria-hidden="true"><span></span><span></span></div>
  <app-add-remark [data]="customer"></app-add-remark>
</ion-content>
