<ion-content class="ion-padding internal_card_container" [ngClass]="listColorClass">
  <form [formGroup]="form" class="bottom_small_popup">
    <div class="global_input_block margin-top">
      <ion-textarea formControlName="demand" label="Demand" fill="outline" labelPlacement="stacked"
        placeholder="write Demand here..."></ion-textarea>
    </div>
    <div class="page_submit_btn">
      <ion-button (click)="saveForm()" class="global_submit_color_button dynamic_bgcolor" expand="block">Save</ion-button>
    </div>
  </form>
</ion-content>
