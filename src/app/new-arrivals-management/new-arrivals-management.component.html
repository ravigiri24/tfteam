<ion-header [ngClass]="listColorClass">

    <ion-label class="top_heading">
      <div class="left_text">
        <span class="selected_text">New Arrivals :</span>
        <b class="total-number">{{newArivalsList?.length}}</b>
      </div>
      <div class="right_action">
        <ion-icon class="dynamic_color" (click)="searchTractor()" name="search-outline"></ion-icon>
        <ion-icon (click)="goToNewArival()" class="theme-color icon-size" name="add-circle-outline"></ion-icon>
        <ion-icon (click)="refreshList()" name="refresh-outline"></ion-icon>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
