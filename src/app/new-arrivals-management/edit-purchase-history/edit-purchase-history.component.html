      <ion-header [ngClass]="listColorClass">
  <ion-toolbar>
    <ion-label class="top_heading">
      <div class="left_text">
        <span class="selected_text" >Purchase</span>
      
      </div>
      <div class="right_action">
        <ion-icon (click)="dismiss()" class="dynamic_color" name="close-circle-outline"></ion-icon>
      </div>
    </ion-label>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding internal_card_container" [ngClass]="listColorClass"> 
      <ion-grid class="main_block_details">
          <ion-card>
        <ion-row>
              <ion-col>Seller Name(Old)</ion-col>
              <ion-col class="amount_col">{{ tractor?.nameOfSeller}}</ion-col>
            </ion-row>
              <ion-row>
              <ion-col>contact1</ion-col>
              <ion-col class="amount_col">{{ tractor?.contact1 }}</ion-col>
            </ion-row>
            <ion-row>
              <ion-col>Address</ion-col>
              <ion-col class="amount_col">{{ tractor?.address }}</ion-col>
            </ion-row>
        
          </ion-card>
       
        </ion-grid>
       <form *ngIf="form" class="form_basic_height" [formGroup]="form" [ngClass]="listColorClass">
       <div class="global-inner-heading">
      <span>Purchase Details           <ion-icon (click)="openCrudManagement('DEALER_LIST')" name="add-circle-outline"></ion-icon>
              <ion-icon (click)="getDealerList(true)" name="refresh-outline"></ion-icon></span>

    </div>
    <div class="global_input_block global_location_block" (click)="selectItem(dealer_list,'Dealer/Bank','dealer_list')">

    <span class="top_layers">Dealer/Bank</span>
    <span class="name_selected">{{dealerName}}</span>
    <ion-icon class="arrow_right" name="caret-down-outline"></ion-icon>

     
  </div>
      <ng-container *ngIf="dealerName=='Other'">
    <div  class="global-inner-heading">
      <span>Seller Details (For Individual)</span>
    </div>
      <div class="global_input_block">
      <ion-input label="Name Of Seller(For Individual)" fill="outline" labelPlacement="stacked" type="text"
        formControlName="nameOfSeller"></ion-input>
    </div>
    <div class="global_input_block">
      <ion-input label="Seller Address" fill="outline" labelPlacement="stacked" type="text"
        formControlName="address"></ion-input>
    </div>
 
    <div class="global_input_block">
      <ion-input label="Seller Contact 1" fill="outline" labelPlacement="stacked" type="text"
        formControlName="contact1"></ion-input>
    </div>
  
  
  </ng-container>
   <div class="page_submit_btn">

      <ion-button (click)="updateItem()" class="global_submit_color_button dynamic_bgcolor" expand="block">Update</ion-button>
    </div>
  </form>
  </ion-content>
