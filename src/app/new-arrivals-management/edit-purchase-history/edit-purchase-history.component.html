<!-- ── Header ── -->
<div class="eph-header" [ngClass]="listColorClass">
  <div class="eph-blob eb1"></div>
  <div class="eph-blob eb2"></div>

  <div class="eph-header-inner">
    <div class="eph-header-icon">
      <ion-icon name="create-outline"></ion-icon>
    </div>
    <div class="eph-header-text">
      <span class="eph-title">Edit Purchase</span>
      <span class="eph-sub">Update dealer & seller details</span>
    </div>
    <button class="eph-close-btn" (click)="dismiss()">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <svg class="eph-wave" viewBox="0 0 400 24" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="M0,0 Q100,24 200,12 Q300,0 400,18 L400,24 L0,24 Z" fill="#fce4ec"/>
  </svg>
</div>

<!-- ── Content ── -->
<ion-content class="eph-content" [ngClass]="listColorClass">

  <!-- Old Seller Info Card -->
  <div class="eph-info-card" *ngIf="tractor?.nameOfSeller || tractor?.contact1 || tractor?.address">
    <div class="eph-info-label">
      <ion-icon name="person-outline"></ion-icon>
      <span>Previous Seller Details</span>
    </div>
    <div class="eph-info-row" *ngIf="tractor?.nameOfSeller">
      <span class="eph-info-key">Seller Name</span>
      <span class="eph-info-val">{{ tractor?.nameOfSeller }}</span>
    </div>
    <div class="eph-info-row" *ngIf="tractor?.contact1">
      <span class="eph-info-key">Contact</span>
      <span class="eph-info-val">{{ tractor?.contact1 }}</span>
    </div>
    <div class="eph-info-row" *ngIf="tractor?.address">
      <span class="eph-info-key">Address</span>
      <span class="eph-info-val">{{ tractor?.address }}</span>
    </div>
  </div>

  <!-- Form -->
  <form *ngIf="form" [formGroup]="form" [ngClass]="listColorClass">

    <!-- Purchase Details Section -->
    <div class="eph-section">
      <div class="eph-section-header">
        <div class="eph-section-header-left">
          <ion-icon name="receipt-outline"></ion-icon>
          <span>Purchase Details</span>
        </div>
        <div class="eph-section-actions">
          <button class="eph-action-btn eph-add-btn" (click)="openCrudManagement('DEALER_LIST')">
            <ion-icon name="add-outline"></ion-icon>
          </button>
          <button class="eph-action-btn eph-refresh-btn" (click)="getDealerList(true)">
            <ion-icon name="refresh-outline"></ion-icon>
          </button>
        </div>
      </div>

      <div class="global_input_block global_location_block eph-location"
        (click)="selectItem(dealer_list,'Dealer/Bank','dealer_list')">
        <span class="top_layers">Dealer/Bank</span>
        <span class="name_selected">{{ dealerName }}</span>
        <ion-icon class="arrow_right" name="caret-down-outline"></ion-icon>
      </div>
    </div>

    <!-- Seller Details (only if Other) -->
    <ng-container *ngIf="dealerName=='Other'">
      <div class="eph-section">
        <div class="eph-section-header eph-section-header--solo">
          <ion-icon name="person-add-outline"></ion-icon>
          <span>Seller Details (Individual)</span>
        </div>
        <div class="global_input_block">
          <ion-input label="Name Of Seller" fill="outline" labelPlacement="stacked"
            type="text" formControlName="nameOfSeller"></ion-input>
        </div>
        <div class="global_input_block">
          <ion-input label="Seller Address" fill="outline" labelPlacement="stacked"
            type="text" formControlName="address"></ion-input>
        </div>
        <div class="global_input_block">
          <ion-input label="Seller Contact 1" fill="outline" labelPlacement="stacked"
            type="text" formControlName="contact1"></ion-input>
        </div>
      </div>
    </ng-container>

    <!-- Submit -->
    <div class="eph-submit">
      <ion-button (click)="updateItem()"
        class="global_submit_color_button eph-update-btn" expand="block">
        <ion-icon slot="start" name="checkmark-done-outline"></ion-icon>
        Update
      </ion-button>
    </div>

  </form>

</ion-content>
