<!-- ── Header ── -->
<div class="tov-header">
  <div class="tov-blob tb1"></div>
  <div class="tov-blob tb2"></div>

  <div class="tov-header-inner">
    <div class="tov-header-icon">
      <ion-icon name="settings-outline"></ion-icon>
    </div>
    <div class="tov-header-text">
      <span class="tov-title">Dashboard</span>
      <span class="tov-sub">Choose an action below</span>
    </div>
    <button class="tov-close-btn" (click)="dismiss()">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <svg class="tov-wave" viewBox="0 0 400 24" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="M0,0 Q100,24 200,12 Q300,0 400,18 L400,24 L0,24 Z" fill="#f8f0ff"/>
  </svg>
</div>

<!-- ── Content ── -->
<ion-content class="tov-content">
  <div class="tov-grid">

    <!-- Forward -->
    <div class="tov-card tov-card-forward" (click)="startTranspotation()">
      <div class="tov-card-glow"></div>
      <div class="tov-card-icon-wrap">
        <img class="tov-card-img" src="././assets/images/fast-forward-button.png" />
      </div>
      <div class="tov-card-label">Forward</div>
      <div class="tov-card-desc">Send to transport</div>
      <ion-icon class="tov-card-arrow" name="arrow-forward-circle-outline"></ion-icon>
    </div>

    <!-- Gallery -->
    <div class="tov-card tov-card-gallery" (click)="goToUplodeSection()">
      <div class="tov-card-glow"></div>
      <div class="tov-card-icon-wrap">
        <img class="tov-card-img" src="././assets/images/gallary.png" />
      </div>
      <div class="tov-card-label">Gallery</div>
      <div class="tov-card-desc">Upload images</div>
      <ion-icon class="tov-card-arrow" name="images-outline"></ion-icon>
    </div>

  </div>
</ion-content>
