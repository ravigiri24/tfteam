<ion-tabs >
  <ion-tab-bar slot="bottom" class="custom-tab-bar {{activeTabsColor}}" class="bottom_footer_row" slot="bottom">
 
   <ion-tab-button tab="TRACTORS" (click)="goToPage('TRACTORS')" [class.active]="selectedTab === 'TRACTORS'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'TRACTORS'">
        <ion-icon name="bag-outline" *ngIf="selectedTab !== 'TRACTORS'"></ion-icon>
        <ion-icon name="bag" *ngIf="selectedTab === 'TRACTORS'"></ion-icon>
      </div>
      <span class="inner_text">Tractors</span>
    </ion-tab-button>


    <ion-tab-button tab="User" (click)="goToPage('User')" [class.active]="selectedTab === 'User'">
      <div class="icon-wrapper" [class.selected]="selectedTab === 'User'">
        <ion-icon name="person-circle-outline" *ngIf="selectedTab !== 'User'"></ion-icon>
        <ion-icon name="person-circle" *ngIf="selectedTab === 'User'"></ion-icon>
      </div>
      <span class="inner_text">User</span>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
